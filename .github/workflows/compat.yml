name: compat

# 解释器兼容矩阵。只挂 schedule + workflow_dispatch，**不挂 pull_request / push**：
# 它要回答的是"这个 SDK 今天还能跑在哪些 python 上"，与单个 PR 改了什么无关；
# 挂到 PR 上只会在每个 codegen PR 上多出一排与本次改动无关的 check，
# 干扰门禁判读（合并门禁只认 ci.yml 里那个 ci-gate）。
#
# 矩阵下界 3.8 —— **实测结论，不等于 setup.py 声明的下界**。
# setup.py 写 python_requires=">=3.5"、classifiers 还列着 3.5/3.6/3.7，
# 但那三个版本今天在 CI 上根本装不出解释器，写进矩阵只会恒红：
#   · actions/python-versions 对 3.7 最后只出到 3.7.17，产物仅 linux-20.04 / 22.04，
#     没有 24.04；而 actions/runner-images 的 README 里 ubuntu-latest 现指向
#     Ubuntu 24.04（26.04 还是 preview），setup-python 会直接报
#     "The version '3.7' with architecture 'x64' was not found for Ubuntu 24.04"。
#   · 3.8 则有 python-3.8.18-linux-24.04-x64 产物，装得出来。
#   · 本地实测 python 3.8.20：`pip install -e .[ci]` / `make lint` / `make test-cov`
#     均 exit 0（48 passed、37 skipped），依赖链能完整解出（sphinx 7.1.2、
#     pytest 8.3.5、flake8 7.1.2）。
# 上界 3.14 —— actions/python-versions 当前的最新稳定版（3.15 还只有 rc）。
#
# fail-fast: false —— 矩阵的价值是"一次看清哪些版本坏了"，
# 有一个版本失败就掐掉其余版本，等于把这份信息丢掉。

on:
  schedule:
    # 每周一 03:00 UTC。频率按"依赖生态变化"的节奏定，不需要更密。
    - cron: '0 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compat:
    name: python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.8', '3.9', '3.10', '3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      # 装同一套 .[ci]：装得上本身就是矩阵要测的一半结论
      # （3.5/3.6/3.7 掉出下界，正是因为这一步再也解不出依赖）。
      - run: pip install -e '.[ci]'
      # 只跑 test-cov：兼容矩阵问的是"这个解释器上 SDK 还能不能用"。
      # ci-syntax 不用在这里重跑——它查的是生成代码本身有没有写坏，
      # 与解释器版本无关，ci.yml 在单一版本上判一次就够。
      - run: make test-cov
